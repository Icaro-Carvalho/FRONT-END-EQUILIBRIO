<div class="container">

    <div  style="margin-bottom: 32px;">
        <h2 class="titulo-tela">Gestão de Bem Estar</h2>
    </div>

    <div class="d-flex flex-wrap gap-2" style="margin-bottom: 52px;">
        <app-modulo-gestao-humor
            status="Estressado" 
            [valor]="20"
            imgSrc="assets/humor-estressado.png"
            [funcionarios]="10"
            [equipes]="10">
        </app-modulo-gestao-humor>
    
        <app-modulo-gestao-humor
            status="Estressado" 
            [valor]="20"
            imgSrc="assets/humor-estressado.png"
            [funcionarios]="10"
            [equipes]="10">
        </app-modulo-gestao-humor>
    
        <app-modulo-gestao-humor
            status="Estressado" 
            [valor]="20"
            imgSrc="assets/humor-estressado.png"
            [funcionarios]="10"
            [equipes]="10">
        </app-modulo-gestao-humor>
    
        <app-modulo-gestao-humor
            status="Estressado" 
            [valor]="20"
            imgSrc="assets/humor-estressado.png"
            [funcionarios]="10"
            [equipes]="10">
        </app-modulo-gestao-humor>
    
        <app-modulo-gestao-humor
            status="Estressado" 
            [valor]="20"
            imgSrc="assets/humor-estressado.png"
            [funcionarios]="10"
            [equipes]="10">
        </app-modulo-gestao-humor>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="titulo-tela">Tabela de Bem Estar</h2>
        <div class="toggle-container">
            <button 
              class="toggle-btn" 
              [ngClass]="{'active': activeButton === 'equipes'}" 
              (click)="setActive('equipes')">
              Equipes
            </button>
            
            <button 
              class="toggle-btn" 
              [ngClass]="{'active': activeButton === 'funcionarios'}" 
              (click)="setActive('funcionarios')">
              Funcionários
            </button>
        </div>
    </div>


    <div class="row align-items-center g-3" style="margin-bottom: 32px;">
        <div class="col-md-3">
            <p class="mb-1">Equipe</p>
            <p-select [options]="cities" [(ngModel)]="selectedCity" optionLabel="name" placeholder="Selecione" class="custom-inputs"/>
        </div>
        <div class="col-md-3">
            <p class="mb-1">Sentimento</p>
            <p-select [options]="cities" [(ngModel)]="selectedCity" optionLabel="name" placeholder="Selecione" class="custom-inputs" />
        </div>
    </div>

    <div class="card">
        <p-table
            [value]="products"
            [paginator]="true"
            [rows]="5"
            paginatorPosition="bottom"
            stripedRows
            [tableStyle]="{'min-width': '50rem'}">
                <ng-template #header>
                    <tr>
                        <th>Equipe</th>
                        <th>Sentimento Geral Da Equipe</th>
                        <th>Ações</th>
                    </tr>
                </ng-template>
                <ng-template #body let-product>
                    <tr>
                        <td>{{product.code}}</td>
                        <td>{{product.name}}</td>
                        <td>{{product.category}}</td>
                    </tr>
                </ng-template>
        </p-table>
    </div>
</div>
