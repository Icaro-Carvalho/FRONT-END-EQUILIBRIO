
<div class="container ">

  <div class="row min-vh-100 d-flex justify-content-start align-items-center margem-lateral"  >
    <div class="col-md-4">
      <h2>Faça seu login</h2>
      <p class="semi-titulo">Acesse sua conta e aproveite todos os recursos.</p>


      <form (submit)="login(); $event.preventDefault()">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu email" required>
        </div>         
        <div class="form-group">
          <label for="senha" class="label-senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" [(ngModel)]="senha" placeholder="Digite sua senha" required>
        </div>
        <div class="esqueci-senha">
          <p><a routerLink="/trocar-senha">Esqueci minha senha</a></p>
        </div>
        <button type="submit" class="btn" [disabled]="!emailValido() || senha.length === 0">ENTRAR</button>
      </form>

    </div>


      <div class="col-md-8 d-flex justify-content-end p-0">
        <img src="assets\foto-login.png" alt="" class="img-fluid login-image">
      </div>

   

  </div>

     
</div>

<p-toast />
